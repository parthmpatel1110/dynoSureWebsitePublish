{{ define "body_classes" }}page-contact{{ end }}

{{ define "main" }}
<div class="container pb-6 pt-6 pt-md-10 pb-md-10">
  <div class="row justify-content-center">
    <div class="col-12 col-md-10">
      <h1 class="title">{{.Title}}</h1>
    </div>
  </div>
  <div class="row justify-content-center mt-4">
    <div class="col-12 col-md-5">
      <div class="contact-info-card">
        <h2>Get In Touch</h2>
        {{ partial "call.html" (dict "site" .Site "context" . "show_button" "false") }}
      </div>
    </div>
    <div class="col-12 col-md-5">
      <div class="contact-form-card">
        <h2>Send Us an Inquiry</h2>
        <form id="contact-form" class="inquiry-form" action="https://formspree.io/f/dynosure.india@gmail.com" method="POST">
          <div class="form-group">
            <label for="name">Full Name *</label>
            <input type="text" id="name" name="name" placeholder="Your name" required>
          </div>
          <div class="form-group">
            <label for="email">Email Address *</label>
            <input type="email" id="email" name="_replyto" placeholder="your@email.com" required>
          </div>
          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="+91 XXXXXXXXXX">
          </div>
          <div class="form-group">
            <label for="product">Product of Interest</label>
            <select id="product" name="product">
              <option value="">— Select a product —</option>
              <option value="SLCANv1">DynoSure SLCANv1</option>
              <option value="SLCAN GPIO">DynoSure SLCAN GPIO</option>
              <option value="LoggerV1">DynoSure LoggerV1</option>
              <option value="Other">Other / General Inquiry</option>
            </select>
          </div>
          <div class="form-group">
            <label for="message">Message *</label>
            <textarea id="message" name="message" rows="5" placeholder="Tell us about your requirements..." required></textarea>
          </div>
          <button type="submit" class="button button-primary">Submit Inquiry</button>
        </form>
      </div>
    </div>
  </div>
</div>
{{ end }}
